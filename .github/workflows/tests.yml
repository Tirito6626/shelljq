name: Run tests

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run bash tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash_docker_image:
          - "bash:latest"
          - "bash:5.3"
          - "bash:5.2"
          - "bash:5.1"
          - "bash:5.0"
          - "bash:4.4"
          - "bash:4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        working-directory: .
        run: |
          bash scripts/tests.sh
  macos-test:
    name: Run tests on native macOS (zsh + bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        working-directory: .
        run: |
          bash scripts/tests.sh
          zsh scripts/tests.sh